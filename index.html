<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14110e" />
  <title>長洲足印</title>
  <meta name="description" content="以傾斜地圖閱讀長洲的廟宇、海岸與西灣步道。座標為約數，並非官方路線。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="preload" as="script" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js" />
  <link rel="preload" as="fetch" href="https://tiles.openfreemap.org/styles/liberty" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=fs7" />
</head>
<body>
  <div id="app">
    <div id="map" role="application" aria-label="長洲足印"></div>
    <div class="vignette" aria-hidden="true"></div>

    <div id="stack" data-sheet="collapsed" data-view="list">
      <button id="sheet-handle" class="sheet-handle" type="button" aria-label="展開或收起路線面板" aria-expanded="false"><span></span></button>
      <div id="sheet-body">
        <nav id="chips" class="chips" aria-label="選擇路線"></nav>
        <section id="mstops" class="mstops" aria-label="站點列表"></section>
        <section id="routes" class="panel" aria-label="步行路線"></section>
      </div>
    </div>

    <aside id="detail" class="panel" hidden aria-live="polite">
      <div class="detail-top">
        <p id="detail-kicker" class="kicker"></p>
        <button id="detail-close" type="button">關閉</button>
      </div>
      <h2 id="detail-title"><span id="detail-num" class="detail-num" aria-hidden="true"></span><span id="detail-name"></span></h2>
      <button id="detail-prev" class="detail-nav prev" type="button" aria-label="上一站"></button>
      <button id="detail-next" class="detail-nav next" type="button" aria-label="下一站"></button>
      <figure id="detail-photo" hidden>
        <img id="detail-img" alt="" decoding="async" />
        <figcaption id="detail-caption"></figcaption>
      </figure>
      <p id="detail-text"></p>
      <p id="detail-en" class="en" lang="en" hidden></p>
      <p id="detail-meta" class="meta"></p>
    </aside>

    <div id="marquee" class="marquee" hidden role="note"><div class="marquee-track"><span id="marquee-text"></span></div></div>
    <div class="map-tools">
      <button id="reset-view" type="button">回到全島</button>
      <button id="locate-me" type="button" aria-pressed="false">我的位置</button>
      <button id="ferry-toggle" type="button" aria-pressed="false">新渡輪</button>
      <button id="svc-toilets" class="svc-btn" type="button" aria-pressed="false"><i></i>公廁</button>
      <button id="svc-food" class="svc-btn" type="button" aria-pressed="false"><i></i>食店</button>
      <div id="ferry-panel" hidden aria-live="polite"></div>
      <p id="map-note">傾斜視角 · 地形與建築為圖磚所能提供的範圍</p>
    </div>

    <p id="status" class="status" hidden></p>

    <div id="gate" class="gate" hidden role="dialog" aria-modal="true" aria-labelledby="gate-title">
      <div class="gate-card panel">
        <h2 id="gate-title"></h2>
        <p id="gate-text"></p>
        <p id="gate-error" class="gate-error" hidden role="alert"></p>
        <button id="gate-signin" type="button" hidden>以學校 Google 帳戶登入</button>
        <p class="gate-back"><a href="./">返回長洲步道</a></p>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
  <script type="module" src="fontsize.js?v=fs7"></script>
  <script type="module" src="app.js?v=fs7"></script>
</body>
</html>
